name: NearShare CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (pyflakes)
        run: |
          python -m pyflakes engine/ tests/ || true
      - name: Run pytest
        run: |
          # Run engine tests; desktop tests only when the directory has content.
          pytest_args="tests/engine"
          if [ -d "tests/desktop" ] && [ "$(ls -A tests/desktop/*.py 2>/dev/null)" ]; then
            pytest_args="$pytest_args tests/desktop"
          fi
          pytest $pytest_args -v

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
      - name: Run Flutter tests
        working-directory: ./mobile
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            if [ -d "test" ] && [ "$(ls -A test/*_test.dart 2>/dev/null)" ]; then
              flutter test
            else
              echo "No flutter tests found, skipping."
            fi
          else
            echo "Flutter app not initialized yet, skipping."
          fi
