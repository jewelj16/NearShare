name: NearShare CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          # Add requirements.txt installation here when created
      - name: Run pytest
        run: |
          # Only run if tests directory has python tests, otherwise mock success
          if [ -d "tests/engine" ] && [ "$(ls -A tests/engine/*.py 2>/dev/null)" ]; then
            pytest tests/engine tests/desktop
          else
            echo "No python tests found, skipping."
          fi

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
      - name: Run Flutter tests
        working-directory: ./mobile
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            if [ -d "test" ] && [ "$(ls -A test/*_test.dart 2>/dev/null)" ]; then
              flutter test
            else
              echo "No flutter tests found, skipping."
            fi
          else
            echo "Flutter app not initialized yet, skipping."
          fi
